# Bazar Manager API — Nginx in front of PocketBase (127.0.0.1:8090). The frontend lives on Vercel.
# Install: copy to /etc/nginx/sites-available/bazar-api, symlink into sites-enabled,
# then `certbot --nginx -d api-bazar.nasfcakes.cloud`.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name api-bazar.nasfcakes.cloud;

  client_max_body_size 10M;

  gzip on;
  gzip_types application/json;
  gzip_min_length 1024;

  # Admin UI and superuser login are never public: use `ssh -L 8090:127.0.0.1:8090 user@vps`.
  location /_/ {
    deny all;
  }
  location ^~ /api/collections/_superusers {
    deny all;
  }

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Realtime (SSE / websocket)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 360s;
  }
}
