# Bazar Manager — Nginx in front of PocketBase (127.0.0.1:8090), which serves the app (pb_public/) and the API.
# Install: copy to /etc/nginx/sites-available/bazar, symlink into sites-enabled,
# then `certbot --nginx -d bazar.nasfcakes.cloud`.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name bazar.nasfcakes.cloud;

  client_max_body_size 16M; # payment proofs (5 MB) and AI photos (3 compressed images)

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # Admin UI and superuser login are never public: use `ssh -L 8090:127.0.0.1:8090 user@vps`.
  location /_/ {
    deny all;
  }
  location ^~ /api/collections/_superusers {
    deny all;
  }

  # AI assistant: one request can run several model calls.
  location /api/ai/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_read_timeout 200s;
  }

  # API + realtime (SSE / websocket)
  location /api/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 360s;
  }

  # Hashed build assets: cache for a year.
  location /assets/ {
    proxy_pass http://127.0.0.1:8090;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Service worker, manifest and entry page: always revalidate so updates arrive.
  location ~ ^/(sw\.js|workbox-.*\.js|index\.html)$ {
    proxy_pass http://127.0.0.1:8090;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    proxy_pass http://127.0.0.1:8090;
    proxy_hide_header Content-Type;
    add_header Content-Type "application/manifest+json";
    add_header Cache-Control "no-cache";
  }

  # App (SPA). PocketBase falls back to index.html for unknown paths with --indexFallback (default on).
  location / {
    proxy_pass http://127.0.0.1:8090;
  }
}
