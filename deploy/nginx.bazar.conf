# Bazar Manager — Nginx in front of PocketBase (127.0.0.1:8090). SSL is added by certbot.
# Install: copy to /etc/nginx/sites-available/bazar, symlink into sites-enabled, then `certbot --nginx -d bazar.nasfcakes.cloud`.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name bazar.nasfcakes.cloud;

  client_max_body_size 10M;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # PocketBase admin UI is never public: reach it with `ssh -L 8090:127.0.0.1:8090 user@vps`.
  location /_/ {
    deny all;
  }
  # Block superuser login over the internet as well (the REST API needs it for any admin call).
  location ^~ /api/collections/_superusers {
    deny all;
  }

  # App shell: always revalidate so a deploy takes effect immediately.
  location = /index.html {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    add_header Cache-Control "no-cache";
  }

  # Content-hashed build output.
  location /assets/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Realtime (SSE / websocket)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 360s;
  }
}
